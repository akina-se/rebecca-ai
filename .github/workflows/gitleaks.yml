name: Gitleaks

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Gitleaks needs the full history to scan properly

      - name: Run Gitleaks CLI (MIT)
        env:
          GITLEAKS_VERSION: "8.30.1"
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TMP_DIR="${{ runner.temp }}/gitleaks"
          mkdir -p "${TMP_DIR}"
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          CHECKSUMS="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          BASE_URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSL "${BASE_URL}/${ARCHIVE}" -o "${TMP_DIR}/${ARCHIVE}"
          curl -fsSL "${BASE_URL}/${CHECKSUMS}" -o "${TMP_DIR}/${CHECKSUMS}"
          (cd "${TMP_DIR}" && grep " ${ARCHIVE}$" "${CHECKSUMS}" | sha256sum -c -)
          tar -xzf "${TMP_DIR}/${ARCHIVE}" -C "${TMP_DIR}" gitleaks
          chmod +x "${TMP_DIR}/gitleaks"

          if [ "${EVENT_NAME}" = "pull_request" ]; then
            LOG_OPTS="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [ -n "${PUSH_BEFORE_SHA}" ] && [ "${PUSH_BEFORE_SHA}" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${PUSH_BEFORE_SHA}^{commit}" 2>/dev/null; then
            if [ "${PUSH_BEFORE_SHA}" = "${PUSH_AFTER_SHA}" ]; then
              LOG_OPTS="-1"
            else
              LOG_OPTS="${PUSH_BEFORE_SHA}..${PUSH_AFTER_SHA}"
            fi
          else
            LOG_OPTS="-1"
          fi

          "${TMP_DIR}/gitleaks" git --verbose --redact --log-opts="${LOG_OPTS}"
          rm -rf "${TMP_DIR}"
