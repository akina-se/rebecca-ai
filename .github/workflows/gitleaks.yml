name: Gitleaks

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Gitleaks needs the full history to scan properly

      - name: Run Gitleaks CLI (MIT)
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          TMP_DIR="${{ runner.temp }}/gitleaks"
          mkdir -p "${TMP_DIR}"
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          CHECKSUMS="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          BASE_URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSL "${BASE_URL}/${ARCHIVE}" -o "${TMP_DIR}/${ARCHIVE}"
          curl -fsSL "${BASE_URL}/${CHECKSUMS}" -o "${TMP_DIR}/${CHECKSUMS}"
          (cd "${TMP_DIR}" && grep " ${ARCHIVE}$" "${CHECKSUMS}" | sha256sum -c -)
          tar -xzf "${TMP_DIR}/${ARCHIVE}" -C "${TMP_DIR}" gitleaks
          chmod +x "${TMP_DIR}/gitleaks"
          "${TMP_DIR}/gitleaks" git --verbose --redact
          rm -rf "${TMP_DIR}"
