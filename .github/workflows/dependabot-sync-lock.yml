name: Dependabot Functions Lockfile Sync

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
      - develop

permissions:
  contents: write

jobs:
  sync-functions-lock:
    name: Sync apps/functions lockfile
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Sync functions lockfile
        run: npm run sync:functions-lock

      - name: Commit and push if out of sync
        run: |
          if [[ -n $(git status --porcelain apps/functions/package-lock.json) ]]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/functions/package-lock.json
            git commit -m "chore(functions): auto-sync package-lock.json for dependabot"
            git push
          else
            echo "apps/functions/package-lock.json is already synchronized."
          fi
