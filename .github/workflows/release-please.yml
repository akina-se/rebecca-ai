name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout Release PR branch
        if: ${{ steps.release.outputs.pr }}
        uses: actions/checkout@v7
        with:
          ref: ${{ fromJson(steps.release.outputs.pr).headBranchName }}
          fetch-depth: 0

      - name: Setup Node.js
        if: ${{ steps.release.outputs.pr }}
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Sync functions package-lock.json
        if: ${{ steps.release.outputs.pr }}
        run: |
          npm run sync:functions-lock
          if ! git diff --quiet apps/functions/package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add apps/functions/package-lock.json
            git commit -m "chore(functions): sync package-lock.json version"
            git push
          fi
