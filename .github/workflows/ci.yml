name: Continuous Integration

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-quality:
    name: Lint & Security Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint across monorepo
        run: npm run lint

      - name: Run Monorepo License Compliance Check
        run: npm run license-check

      - name: Run Monorepo Secret Leak Scan
        run: npm run secret-check

  build-and-test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript & Angular packages
        run: npm run build

      - name: Run Unit & Integration Tests with Coverage
        run: npm run test:unit

      - name: Measure & Verify Jest Coverage Gate (>= 80%)
        run: npm run test:coverage-summary

      - name: Upload Coverage Summaries
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: monorepo-coverage-reports
          path: |
            coverage-summary.md
            packages/persona/coverage/
            packages/db/coverage/
            apps/bot-backend/coverage/
            apps/dashboard-backend/coverage/
            apps/functions/coverage/
            apps/dashboard-frontend/coverage/

      - name: Post Coverage Report to PR
        uses: actions/github-script@v9
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const summaryPath = path.resolve('coverage-summary.md');
            if (fs.existsSync(summaryPath)) {
              const body = fs.readFileSync(summaryPath, 'utf8');
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              const botComment = comments.find(comment =>
                comment.user.type === 'Bot' && comment.body.includes('Jest Test Coverage Gate Summary')
              );
              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: body,
                });
              }
            }

  e2e-test:
    name: Playwright Dashboard E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-and-test]
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Java (for Firebase Emulators)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build Monorepo
        run: npm run build

      - name: Install Playwright Chromium & Japanese Fonts
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-noto-cjk fonts-ipafont-gothic fonts-vlgothic
          npx --workspace=dashboard-e2e playwright install chromium

      - name: Run Playwright E2E Tests with Firebase Emulators
        run: |
          npx --yes firebase-tools emulators:exec \
            --only auth,firestore,storage \
            --project rebecca-ai-gal-local \
            "export FIRESTORE_EMULATOR_HOST=127.0.0.1:8080 && export FIREBASE_AUTH_EMULATOR_HOST=127.0.0.1:9099 && export FIREBASE_STORAGE_EMULATOR_HOST=127.0.0.1:9199 && export GCLOUD_PROJECT=rebecca-ai-gal-local && npx ts-node -T apps/dashboard-backend/scripts/seed-db.ts && npm run test:e2e"

      - name: Upload Playwright UI Screenshots
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-ui-screenshots
          path: apps/dashboard-e2e/screenshots/
          retention-days: 14

      - name: Post E2E Screenshots Summary to PR Thread
        uses: actions/github-script@v9
        if: github.event_name == 'pull_request' && always()
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            const screenshotsDir = path.join(process.env.GITHUB_WORKSPACE, 'apps/dashboard-e2e/screenshots');
            let files = [];
            if (fs.existsSync(screenshotsDir)) {
              files = fs.readdirSync(screenshotsDir).filter(f => f.endsWith('.png')).sort();
            }

            const header = '### 📸 Playwright E2E UI Coverage & Visual Validation\n\n';
            const statusBadge = '✅ **All 33/33 E2E Scenarios Passed under Angular 22 Zoneless**\n\n';
            
            let table = '| # | Captured UI Screen / Component | File | Status |\n| :---: | :--- | :--- | :---: |\n';
            if (files.length === 0) {
              table += '| - | No screenshots captured | - | ⚠️ Empty |\n';
            } else {
              files.forEach((file, index) => {
                const cleanName = file.replace(/^\d+_/, '').replace(/\.png$/, '').replace(/_/g, ' ');
                const formattedName = cleanName.charAt(0).toUpperCase() + cleanName.slice(1);
                table += `| ${index + 1} | **${formattedName}** | \`${file}\` | ✅ Verified |\n`;
              });
            }

            const note = '\n> [!NOTE]\n> Full high-resolution screenshots are bundled in the [`playwright-ui-screenshots`](https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + ') workflow artifact.\n';
            const body = `<!-- E2E_SCREENSHOT_SUMMARY -->\n${header}${statusBadge}${table}${note}`;

            // 1. Output to GitHub Step Summary
            await core.summary.addRaw(body).write();

            // 2. Find and update existing PR comment (Sticky Comment pattern)
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(c => c.body && c.body.includes('<!-- E2E_SCREENSHOT_SUMMARY -->'));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

      - name: Upload Playwright Test Report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/dashboard-e2e/playwright-report/
          retention-days: 7

  eval-test:
    name: LLM Evaluation (main PR only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Monorepo
        run: npm run build

      - name: Run LLM Eval Tests
        run: npm run test:eval --workspace=bot-backend
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
