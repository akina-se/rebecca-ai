<div 
  [class.authenticated-layout]="isLoggedIn()" 
  [class.login-layout]="!isLoggedIn()"
  [attr.data-authenticated]="isLoggedIn()">
  
  @if (isLoggedIn()) {
    <app-sidebar></app-sidebar>
  }
  
  <div class="main-content">
    @if (isLoggedIn()) {
      <app-top-nav></app-top-nav>
    }
    
    <router-outlet></router-outlet>
    <app-toast></app-toast>
  </div>

  @if (isLoggedIn()) {
    <app-ai-drawer></app-ai-drawer>
  }
</div>
