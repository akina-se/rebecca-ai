<div class="modal-backdrop" *ngIf="isOpen" (click)="onBackdropClick($event)">
    <div class="modal-container glass-panel" role="dialog" aria-modal="true">

        <!-- Header -->
        <div class="modal-header">
            <div class="modal-title">
                <span class="material-icons">emoji_events</span>
                {{ title }}
            </div>
            <button class="close-btn" (click)="onClose()" aria-label="Close">
                <span class="material-icons">close</span>
            </button>
        </div>

        <!-- Table -->
        <div class="modal-body">
            <table class="ranking-table">
                <thead>
                    <tr>
                        <th class="rank-col">Rank</th>
                        <th>{{ colLabel }}</th>
                        <th class="metric-col">{{ colMetric }}</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let entry of pagedEntries" [class.podium]="entry.rank <= 3">
                        <td class="rank-cell">
                            <span *ngIf="entry.badge" class="rank-badge">{{ entry.badge }}</span>
                            <span *ngIf="!entry.badge" class="rank-number">{{ entry.rank }}</span>
                        </td>
                        <td class="label-cell">{{ entry.label }}</td>
                        <td class="metric-cell">{{ entry.value }}</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="modal-footer" *ngIf="totalPages > 1">
            <button class="page-btn" [disabled]="currentPage === 1" (click)="goToPage(currentPage - 1)">
                <span class="material-icons">chevron_left</span>
            </button>
            <button class="page-btn"
                *ngFor="let p of pageNumbers"
                [class.active]="p === currentPage"
                (click)="goToPage(p)">
                {{ p }}
            </button>
            <button class="page-btn" [disabled]="currentPage === totalPages" (click)="goToPage(currentPage + 1)">
                <span class="material-icons">chevron_right</span>
            </button>
            <span class="page-info">Page {{ currentPage }} / {{ totalPages }}</span>
        </div>
    </div>
</div>
