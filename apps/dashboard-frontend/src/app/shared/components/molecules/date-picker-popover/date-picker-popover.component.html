<div class="time-nav-wrapper">
  <div class="time-nav" [class.disabled]="mode === 'all-time'" (click)="toggle()">
    <span class="material-icons nav-btn" (click)="onPrev($event)">chevron_left</span>
    <span class="current-text">{{ currentText }}</span>
    <span class="material-icons nav-btn" [class.disabled-icon]="!hasNext" (click)="onNext($event)">chevron_right</span>
  </div>

  @if (isOpen) {
    <div class="popover-menu glass-panel">
      <div class="popover-header">{{ 'common.quick_select' | translate }}</div>
      <div class="popover-list">
        @for (opt of mockOptions; track opt) {
          <div class="popover-item"
            [class.selected]="opt === currentText"
            (click)="select(opt, $event)">
            {{ opt }}
          </div>
        }
      </div>
    </div>
  }
</div>
