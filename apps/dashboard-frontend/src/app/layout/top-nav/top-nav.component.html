<div class="topbar glass-panel">
    <div style="display: flex; align-items: center; gap: 20px;">
        <div class="breadcrumb">Admin <span class="material-icons" style="font-size: 1rem; color: var(--text-muted)">chevron_right</span> <span>Dashboard</span></div>
    </div>
    <div class="user-menu" style="display: flex; align-items: center; gap: 10px;">
        <button class="sparkle-btn" (click)="toggleDrawer()"><span class="material-icons" style="font-size: 1.1rem;">auto_awesome</span> Rebecca</button>
        <div style="width: 1px; height: 24px; background: var(--border-color); margin: 0 5px;"></div>
        <div style="position: relative; cursor: pointer;" (click)="toggleUserDropdown($event)">
            <img [src]="userAvatarUrl" alt="Admin Account" class="avatar" style="width: 36px; height: 36px; border-radius: 50%;">
            <!-- User Dropdown Menu -->
            <div class="user-dropdown-menu" *ngIf="isUserDropdownOpen" style="position: absolute; top: calc(100% + 10px); right: 0; background: rgba(20, 15, 25, 0.97); border: 1px solid var(--border-color); border-radius: 12px; min-width: 180px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); z-index: 1000; overflow: hidden; backdrop-filter: blur(16px); animation: slideDown 0.2s ease-out;">
                <div style="padding: 12px 16px; border-bottom: 1px solid var(--border-highlight);">
                    <div style="font-weight: bold; color: var(--text-main); font-size: 0.9rem;">{{ user?.displayName || 'Admin User' }}</div>
                    <div style="font-size: 0.75rem; color: var(--text-muted);">{{ user?.email || 'admin&#64;example.com' }}</div>
                </div>
                <div style="padding: 8px 0;">
                    <div class="dropdown-item" (click)="logout()" style="padding: 8px 16px; font-size: 0.85rem; color: var(--danger); cursor: pointer; display: flex; align-items: center; gap: 8px;">
                        <span class="material-icons" style="font-size: 1rem;">logout</span> Logout
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
