<div class="view-section active">
    <div class="view-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
        <h2><span class="material-icons">dns</span> System Memory Layers</h2>
        <button class="btn btn-primary" (click)="forceDreaming()" [disabled]="isDreaming" style="display: flex; align-items: center; gap: 8px; width: 185px; justify-content: center; overflow: hidden; white-space: nowrap;">
            <span class="material-icons" [class.spinning]="isDreaming" style="flex-shrink:0;">{{ isDreaming ? 'sync' : 'auto_awesome' }}</span>
            {{ isDreaming ? 'Processing...' : 'Force Dreaming' }}
        </button>
    </div>
    <table class="data-table glass-panel" style="border-radius: 12px;">
        <thead><tr><th>Layer</th><th>Description</th><th>Last Updated</th></tr></thead>
        <tbody>
            <tr class="clickable" *ngFor="let layer of layers" (click)="openDrawer(layer.level, layer.name, getIconForLayer(layer.level))">
                <td><span class="badge" [style.background]="layer.level === 0 ? 'rgba(255,255,255,0.1)' : ''" [style.color]="layer.level === 0 ? 'var(--text-main)' : ''">Layer {{ layer.level }}</span> {{ layer.name }}</td>
                <td>{{ layer.description }}</td>
                <td style="color: var(--text-muted); white-space: nowrap;" [title]="layer.lastUpdated || ''">{{ layer.lastUpdated | tzDate:'System Deploy' }}</td>
            </tr>
            <tr *ngIf="layers.length === 0 && !isLoading">
                <td colspan="3" style="text-align: center; padding: 20px; color: var(--text-muted)">No memory layers found.</td>
            </tr>
            <tr *ngIf="isLoading">
                <td colspan="3" style="text-align: center; padding: 20px; color: var(--text-muted)">Loading...</td>
            </tr>
        </tbody>
    </table>
</div>

<app-right-drawer [isOpen]="isDrawerOpen" [title]="drawerTitle" [icon]="drawerIcon" (closeDrawer)="isDrawerOpen = false">
    <app-memory-drawer [level]="drawerLevel"></app-memory-drawer>
</app-right-drawer>
