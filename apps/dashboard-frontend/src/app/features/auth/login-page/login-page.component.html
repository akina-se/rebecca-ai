<div class="login-container">
  <div class="glass-panel login-card">
    <div class="logo-container">
      <div class="logo-dot"></div>
      <h1 class="logo-text">REBECCA OS</h1>
    </div>
    
    <div class="welcome-text">
      <h2>Access Required</h2>
      <p>Please authenticate to access the admin dashboard.</p>
    </div>

    <div *ngIf="error" class="alert-banner error-banner">
      <span class="material-icons">error_outline</span>
      <span>{{ error }}</span>
    </div>

    <button 
      class="btn btn-primary login-btn" 
      (click)="loginWithGoogle()" 
      [disabled]="isLoading">
      
      <span class="material-icons" *ngIf="!isLoading">login</span>
      <span class="material-icons spinning" *ngIf="isLoading">sync</span>
      <span>{{ isLoading ? 'Authenticating...' : 'Sign in with Google' }}</span>
    </button>
    
    <div class="neon-line"></div>
  </div>
</div>
