<div class="login-container">
  <div class="glass-panel login-card">
    <div class="logo-container">
      <img src="assets/gemitec_logo.svg" alt="GEMITEC" class="login-logo">
    </div>
    
    <div class="welcome-text">
      <h2>{{ configService.adminTitle() }}</h2>
      <p>Authorized access only. Please authenticate to interface with the {{ configService.brandName() }} administration console.</p>
    </div>

    @if (error) {
      <div class="alert-banner error-banner">
        <span class="material-icons">error_outline</span>
        <span>{{ error }}</span>
      </div>
    }

    <button 
      class="btn btn-primary login-btn" 
      (click)="loginWithGoogle()" 
      [disabled]="isLoading">
      
      @if (!isLoading) {
        <span class="material-icons">login</span>
      } @else {
        <span class="material-icons spinning">sync</span>
      }
      <span>{{ isLoading ? 'Authenticating...' : 'Sign in with Google' }}</span>
    </button>
    
    <div class="neon-line"></div>
  </div>
</div>
