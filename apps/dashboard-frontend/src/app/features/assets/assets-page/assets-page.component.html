<div class="view-section active">
    <div class="block-header" style="margin-top: 0;">
        <h2><span class="material-icons">collections</span> Assets Library</h2>
        <div style="display: flex; gap: 10px;">
            <input type="text" class="form-control" placeholder="Search assets..." style="width: 250px; padding: 0.5rem; border-radius: 20px;">
            <button class="btn btn-primary" (click)="mockAlert('Mock: Open Asset Upload Modal (Supports Multiple Files)')"><span class="material-icons">upload_file</span> Upload Asset</button>
        </div>
    </div>
    
    <div class="bulk-actions-bar glass-panel" id="asset-bulk-bar" style="margin-bottom: 1.5rem; border-radius: 12px; border: 1px solid var(--border-color);">
        <label class="checkbox-container">
            <input type="checkbox" class="select-all" [checked]="selectAll" (change)="toggleSelectAll()">
            <span class="checkmark"></span>
            <span style="margin-left: 8px;">Select All</span>
        </label>
        <div style="width: 1px; height: 16px; background: var(--border-color); margin: 0 10px;"></div>
        <span class="bulk-text" style="color: var(--text-muted); font-style: italic; flex: 1;">
            {{ selectedAssets.size > 0 ? selectedAssets.size + ' items selected' : 'Select items to perform actions' }}
        </span>
        <button class="btn bulk-btn" 
            [style.visibility]="selectedAssets.size > 0 ? 'visible' : 'hidden'"
            [disabled]="isDeletingBulk || isRetryingBulk"
            style="min-width: 110px; justify-content: center; padding: 4px 8px; font-size: 0.8rem; border-color: var(--danger); color: var(--danger); display: flex; align-items: center; gap: 4px; white-space: nowrap;" 
            (click)="executeBulkDelete()">
            <span class="material-icons" [class.spinning]="isDeletingBulk" style="font-size: 1rem">{{ isDeletingBulk ? 'sync' : 'delete' }}</span> 
            {{ isDeletingBulk ? 'Deleting...' : 'Delete' }}
        </button>
        <button class="btn bulk-btn" 
            [style.visibility]="selectedAssets.size > 0 ? 'visible' : 'hidden'"
            [disabled]="isDeletingBulk || isRetryingBulk"
            style="min-width: 130px; justify-content: center; padding: 4px 8px; font-size: 0.8rem; border-color: var(--color-primary); color: var(--text-main); background: var(--color-primary); display: flex; align-items: center; gap: 4px; white-space: nowrap;" 
            (click)="executeBulkRetry()">
            <span class="material-icons" [class.spinning]="isRetryingBulk" style="font-size: 1rem">{{ isRetryingBulk ? 'sync' : 'autorenew' }}</span> 
            {{ isRetryingBulk ? 'Retrying...' : 'Retry AI Gen' }}
        </button>
    </div>
    
    <div class="asset-grid">
        <div class="asset-card glass-panel" *ngFor="let asset of assets" (click)="openAssetDrawer(asset.id)">
            <div class="asset-checkbox-wrapper" (click)="$event.stopPropagation()">
                <label class="checkbox-container">
                    <input type="checkbox" class="asset-checkbox" [checked]="selectedAssets.has(asset.id)" (change)="toggleSelection(asset.id, $event)">
                    <span class="checkmark" style="margin: 0;"></span>
                </label>
            </div>
            <!-- If we actually have a url to an image, we can show it here instead of a material icon. For MVP, we might just show an icon or a placeholder image if url is not present -->
            <div class="asset-thumb" [style.background-image]="asset.url ? 'url(' + asset.url + ')' : 'none'" [style.background-size]="'cover'">
                <span class="material-icons" style="font-size: 3rem; opacity: 0.5;" *ngIf="!asset.url">image</span>
            </div>
            <div class="asset-info">
                <div style="font-weight: 500;">{{ asset.filename }}</div>
                <div style="font-size: 0.75rem; color: var(--text-muted); display: flex; justify-content: space-between; margin-top: 6px;">
                    <span>Used: 0x</span><span style="color: var(--success)">{{ asset.status || 'Ready' }}</span>
                </div>
            </div>
        </div>
    </div>
    <div *ngIf="assets.length === 0 && !isLoading" style="text-align: center; padding: 20px; color: var(--text-muted)">
        No assets found.
    </div>
    <div *ngIf="isLoading" style="text-align: center; padding: 20px; color: var(--text-muted)">
        Loading...
    </div>
</div>

<app-right-drawer [isOpen]="isDrawerOpen" [title]="drawerTitle" [icon]="drawerIcon" (closeDrawer)="isDrawerOpen = false">
    <div style="padding: 20px;">
        <app-asset-drawer [assetId]="selectedAssetId"></app-asset-drawer>
    </div>
</app-right-drawer>
