    CampaignStatus:
      type: string
      enum: [draft, scheduled, active, completed, archived]
      description: Lifecycle status of a narrative event campaign.
      example: scheduled

    SlotTimePeriod:
      type: string
      enum: [morning, afternoon, evening, night]
      description: Canonical slot period classification.
      example: morning

    SlotStatus:
      type: string
      enum: [pending, posted, skipped, failed]
      description: Execution state of an individual narrative itinerary slot.
      example: pending

    CampaignSlot:
      type: object
      required:
        - slotId
        - dayNumber
        - timePeriod
        - scheduledTime
        - theme
        - status
      properties:
        slotId:
          type: string
          example: slot-1-0800
        dayNumber:
          type: integer
          minimum: 1
          example: 1
        timePeriod:
          $ref: '#/components/schemas/SlotTimePeriod'
        scheduledTime:
          type: string
          format: date-time
          example: "2026-11-01T08:00:00Z"
        theme:
          type: string
          example: Arrival in Kyoto
        captionPromptHint:
          type: string
          example: Excited arrival tweet with bullet train view
        status:
          $ref: '#/components/schemas/SlotStatus'
        isFixedText:
          type: boolean
          default: false
        fixedTextOverride:
          type: string
        mediaUrl:
          type: string
          format: uri
        postedTweetId:
          type: string
        postedAt:
          type: string
          format: date-time
        errorReason:
          type: string

    CampaignDoc:
      type: object
      required:
        - title
        - startDate
        - endDate
        - status
        - dailySlotTimes
        - masterContext
        - replyContextSummary
        - slots
        - totalSlotsCount
        - completedSlotsCount
        - isPaused
        - createdAt
        - updatedAt
      properties:
        title:
          type: string
          example: Kyoto Journey
        description:
          type: string
          example: Fall tour in historical Kyoto
        hashtag:
          type: string
          example: RebeccaKyotoTrip
        startDate:
          type: string
          format: date
          example: "2026-11-01"
        endDate:
          type: string
          format: date
          example: "2026-11-03"
        status:
          $ref: '#/components/schemas/CampaignStatus'
        dailySlotTimes:
          type: array
          items:
            type: string
            pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          example: ["08:00", "12:00", "19:00"]
        masterContext:
          type: string
          example: Rebecca travels to Kyoto for sightseeing and autumn colors.
        replyContextSummary:
          type: string
          example: Rebecca is currently in Kyoto enjoying traditional sweets and shrines.
        isAnnualRecurring:
          type: boolean
          default: false
        slots:
          type: array
          items:
            $ref: '#/components/schemas/CampaignSlot'
        totalSlotsCount:
          type: integer
          example: 9
        completedSlotsCount:
          type: integer
          example: 3
        isPaused:
          type: boolean
          default: false
        createdAt:
          type: string
          format: date-time
          example: "2026-09-18T00:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-09-18T00:00:00.000Z"

    CampaignDocWithId:
