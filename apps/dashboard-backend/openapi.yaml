openapi: 3.0.3
info:
  title: Rebecca Admin Dashboard BFF API
  description: |
    Backend-for-Frontend (BFF) API serving the Rebecca AI Admin Dashboard.
    Provides endpoints for user monitoring, memory administration, timeline post history, and image asset uploads.
    
    ### Timezones
    All datetimes are returned in ISO-8601 UTC format (with `Z` suffix).
    Aggregation endpoints (like `/posts`) handle JST (Japan Standard Time, UTC+09:00) conversions internally when using the `period` and `isoDate` query parameters to prevent date boundary alignment bugs.
  version: 1.0.0
servers:
  - url: http://localhost:8081/api/v1
    description: Local Dev Server
security:
  - BearerAuth: []
paths:
  /auth/me:
    get:
      summary: Get current authenticated admin user profile
      description: Retrieves user ID, verified email address, and role from the decoded Firebase Auth ID token.
      responses:
        '200':
          description: Authenticated user details
          content:
            application/json:
              schema:
                type: object
                properties:
                  uid:
                    type: string
                    example: "firebase_user_abc123"
                  email:
                    type: string
                    format: email
                    example: "admin@example.com"
                  role:
                    type: string
                    example: "ADMIN"
        '401':
          description: Unauthorized or token missing/invalid

  /alerts:
    get:
      summary: Get dynamic system warnings and alerts
      description: Aggregates active warnings dynamically across the system (e.g., failed image captions count).
      responses:
        '200':
          description: Dynamic alerts list
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: array
                    items:
                      $ref: '#/components/schemas/SystemAlert'
                  Count:
                    type: integer
                    example: 1

  /users:
    get:
      summary: Retrieve users list (Leaderboard)
      description: Returns a paginated leaderboard or list of monitored users.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: startAfterId
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          description: Prefix search by user handle
          schema:
            type: string
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
            enum: [interactions, username, id, lastSeen]
        - name: sortOrder
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserOverview'
                  Count:
                    type: integer

  /users/status:
    put:
      summary: Bulk update user statuses
      description: Updates the status of multiple users simultaneously (Active, Blocked, Muted).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ids
                - status
              properties:
                ids:
                  type: array
                  items:
                    type: string
                status:
                  $ref: '#/components/schemas/UserStatus'
      responses:
        '200':
          description: Bulk status update results
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

  /users/{id}:
    get:
      summary: Get user details and chat history
      description: Retrieves full profile details and paginated chat history for a specific user handle.
      parameters:
        - name: id
          in: path
          required: true
          description: User handle (without @ prefix, e.g. rebecca_oshi)
          schema:
            type: string
        - name: beforeTimestamp
          in: query
          required: false
          description: Before ISO timestamp for paginated chat history
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Limit for chat logs page size
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Detailed user details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
        '404':
          description: User not found

  /users/{id}/memory:
    put:
      summary: Update a user's memory profile
      description: Manually modifies the RAG memory categories and profile attributes of a user.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - coreProfile
              properties:
                coreProfile:
                  $ref: '#/components/schemas/UserCoreProfile'
                status:
                  $ref: '#/components/schemas/UserStatus'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

  /posts:
    get:
      summary: Retrieve timeline posts history
      description: Retrieves paginated timeline posts, filtered by period and JST-aligned range.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: startAfterId
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          description: Search pattern for post snippets
          schema:
            type: string
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [monthly, yearly, all-time]
            default: all-time
        - name: isoDate
          in: query
          required: false
          description: JST-aligned date boundary parameter (e.g. "2026-07" for monthly, "2026" for yearly)
          schema:
            type: string
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
            default: time
        - name: sortOrder
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: List of posts
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: array
                    items:
                      $ref: '#/components/schemas/TimelinePost'
                  Count:
                    type: integer

    delete:
      summary: Bulk delete timeline posts
      description: Triggers deletion of posts from both Firestore and X (Twitter) via Bot gRPC client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ids
              properties:
                ids:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Deletion results
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  deletedCount:
                    type: integer
                    example: 3

  /images:
    get:
      summary: Retrieve library image assets
      description: Returns a list of image assets with automatic alt-text generated by Gemini.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: startAfterId
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AssetStatus'
      responses:
        '200':
          description: List of image assets
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: array
                    items:
                      $ref: '#/components/schemas/ImageAsset'
                  Count:
                    type: integer

  /images/upload:
    post:
      summary: Upload an image asset
      description: Uploads a raw image file to GCS and queues Gemini for auto-captioning.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
      responses:
        '200':
          description: Uploaded image record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageAsset'

  /images/{id}:
    put:
      summary: Edit image metadata
      description: Updates the user-assigned name or caption for an image asset.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                caption:
                  type: string
      responses:
        '200':
          description: Image metadata updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

  /memory/layers:
    get:
      summary: Retrieve system memory layer structure
      description: Lists the different system memory layers (Level 0, 1, 2) and their editing permissions.
      responses:
        '200':
          description: Memory layers list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MemoryLayer'

  /memory/core:
    get:
      summary: Get Layer 0 Core Persona Prompt & Master Patterns
      description: Returns the immutable identity, behavioral guidelines, and the 120 persona master patterns for Rebecca.
      responses:
        '200':
          description: Core prompt instructions and 120-pattern master data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryContent'

  /memory/global:
    get:
      summary: Get Layer 2 Global Memory
      description: Retrieves the dynamic global memory context summary.
      responses:
        '200':
          description: Global summary memory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryContent'
    put:
      summary: Update Layer 2 Global Memory
      description: Manually overrides the global personality memory summary.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
              properties:
                content:
                  type: string
      responses:
        '200':
          description: Memory updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

  /memory/force-dreaming:
    post:
      summary: Force full memory consolidation (Self-Reflection, Dreaming, Evolution)
      description: Non-blocking trigger to orchestrate multi-tiered background memory consolidation in the Bot backend (executing /batch/self-reflection for Layer 2 timeline summary, /batch/dreaming for throttled user episodic profiles, and /batch/evolution for Layer 1 prompt evolution).
      responses:
        '202':
          description: Multi-phase memory consolidation initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Memory consolidation batch sequence initiated

  /copilot/chat:
    post:
      summary: Send chat message to Admin Copilot
      description: Interactive conversational assistance with real-time UI context and optional Human-In-The-Loop (HITL) action proposals.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopilotRequest'
      responses:
        '200':
          description: Copilot structured response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CopilotResponse'
        '400':
          description: Missing or invalid message
        '500':
          description: Internal processing error

  /settings:
    get:
      summary: Retrieve system preferences
      description: Returns persisted global language and timezone settings.
      responses:
        '200':
          description: Current settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SystemSettings'
    patch:
      summary: Update system preferences
      description: Modifies global language or timezone preferences.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                language:
                  type: string
                  enum: [ja, en]
                timezone:
                  type: string
                  example: "Asia/Tokyo"
      responses:
        '200':
          description: Updated settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SystemSettings'
        '400':
          description: Invalid language or timezone identifier

  /config:
    get:
      summary: Get client runtime configuration
      description: Public endpoint providing client Firebase identifiers, base API paths, and active persona metadata.
      security: []
      responses:
        '200':
          description: Public configuration parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeConfig'

  /campaigns:
    get:
      summary: List narrative event campaigns
      description: Retrieves a paginated list of narrative event campaigns with optional status filtering.
      parameters:
        - name: page
          in: query
          description: Target page number (1-indexed).
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          description: Items per page (clamped between 1 and 50).
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 50
        - name: status
          in: query
          description: Filter by campaign lifecycle status.
          schema:
            $ref: '#/components/schemas/CampaignStatus'
      responses:
        '200':
          description: Paginated campaigns list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCampaignsResponse'
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
    post:
      summary: Create a new narrative event campaign
      description: Creates a new campaign. If status is scheduled or active, schedule collision checks and slot generation are enforced.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCampaignRequest'
      responses:
        '201':
          description: Campaign created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CampaignDocWithId'
        '400':
          description: Validation error or missing required fields
        '409':
          description: Schedule conflict with an existing active or scheduled campaign
        '500':
          description: Internal server error

  /campaigns/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Unique campaign document ID
        schema:
          type: string
    get:
      summary: Get campaign details by ID
      description: Retrieves full campaign document including all itinerary slots.
      responses:
        '200':
          description: Campaign document
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CampaignDocWithId'
        '404':
          description: Campaign not found
        '500':
          description: Internal server error
    put:
      summary: Update an existing campaign
      description: Updates campaign configuration and reconciles itinerary slots if schedule dates changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCampaignRequest'
      responses:
        '200':
          description: Updated campaign document
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CampaignDocWithId'
        '400':
          description: Validation error
        '404':
          description: Campaign not found
        '409':
          description: Schedule conflict with another active or scheduled campaign
        '500':
          description: Internal server error
    delete:
      summary: Delete a campaign
      description: Permanently removes a campaign document and its itinerary configuration.
      responses:
        '204':
          description: Campaign deleted successfully
        '404':
          description: Campaign not found
        '500':
          description: Internal server error

  /campaigns/{id}/clone:
    parameters:
      - name: id
        in: path
        required: true
        description: Source campaign document ID to clone
        schema:
          type: string
    post:
      summary: Clone an existing campaign
      description: Creates a duplicated campaign with reset slot execution statuses for recurring or iterating annual events.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloneCampaignRequest'
      responses:
        '201':
          description: Cloned campaign created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CampaignDocWithId'
        '400':
          description: Invalid date format
        '404':
          description: Source campaign not found
        '409':
          description: Overlapping schedule conflict with another campaign
        '500':
          description: Internal server error

  /campaigns/{id}/pause:
    parameters:
      - name: id
        in: path
        required: true
        description: Target campaign document ID
        schema:
          type: string
    post:
      summary: Emergency pause campaign execution
      description: Sets isPaused flag to true. Halts subsequent automated slot posting immediately.
      responses:
        '200':
          description: Campaign paused successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CampaignDocWithId'
        '404':
          description: Campaign not found
        '500':
          description: Internal server error

  /campaigns/{id}/resume:
    parameters:
      - name: id
        in: path
        required: true
        description: Target campaign document ID
        schema:
          type: string
    post:
      summary: Resume a paused campaign
      description: Resets isPaused flag to false to allow automated slot posting according to schedule.
      responses:
        '200':
          description: Campaign resumed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CampaignDocWithId'
        '404':
          description: Campaign not found
        '500':
          description: Internal server error

  /campaigns/{id}/assets:
    parameters:
      - name: id
        in: path
        required: true
        description: Campaign document ID for isolated asset storage partitioning
        schema:
          type: string
    post:
      summary: Upload an illustration asset for a campaign slot
      description: Uploads an image file directly to isolated Google Cloud Storage campaign partition.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Image file to upload (JPEG, PNG, WebP up to 15MB).
      responses:
        '200':
          description: Asset uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CampaignAssetUploadResult'
        '400':
          description: No file uploaded or unsupported mime type
        '404':
          description: Campaign not found
        '500':
          description: Internal server error

  /campaigns/{id}/assets/{filename}:
    parameters:
      - name: id
        in: path
        required: true
        description: Campaign document ID
        schema:
          type: string
      - name: filename
        in: path
        required: true
        description: Asset filename
        schema:
          type: string
    get:
      summary: Stream campaign illustration image with on-demand WebP thumbnail generation
      description: Public streaming endpoint returning image binary. Supports query parameter size=thumbnail (400px WebP) or size=full (original image).
      security: []
      parameters:
        - name: size
          in: query
          required: false
          description: Image resolution mode ('thumbnail' for compressed 400px WebP or 'full' for original resolution)
          schema:
            type: string
            enum: [full, thumbnail]
            default: full
      responses:
        '200':
          description: Binary image data
          content:
            image/webp:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid campaign ID or filename
        '404':
          description: Campaign asset not found
        '500':
          description: Internal server error
    delete:
      summary: Delete campaign illustration asset permanently from Google Cloud Storage
      description: Permanently deletes the original image file and cached WebP thumbnails from Google Cloud Storage.
      responses:
        '200':
          description: Asset deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Invalid campaign ID or filename
        '404':
          description: Campaign not found
        '500':
          description: Internal server error

components:
  schemas:
    SystemAlert:
      type: object
      properties:
        id:
          type: string
          example: alert-failed-captions
        type:
          type: string
          enum: [warning, info]
          example: warning
        message:
          type: string
          example: "3 image caption generations failed in the last 24 hours."
        timestamp:
          type: string
          format: date-time
          example: "2026-07-18T13:35:28.000Z"

    UserSummary:
      type: object
      properties:
        id:
          type: string
          example: "1934600616791482369"
        username:
          type: string
          example: "se_akina"
        name:
          type: string
          example: "AKINA"
        interactions:
          type: integer
          example: 2
        firstSeen:
          type: string
          example: "2026-06-29T14:05:12.200Z"
        lastSeen:
          type: string
          example: "2026-07-12T07:52:34.766Z"
        coreProfile:
          type: string
          description: JSON serialized string of profile structure
          example: '{"attributes":["student"],"preferences":["anime"],"concerns":[],"important_memories":[]}'
        status:
          $ref: '#/components/schemas/UserStatus'

    UserDetail:
      type: object
      properties:
        id:
          type: string
          example: "1934600616791482369"
        username:
          type: string
          example: "se_akina"
        name:
          type: string
          example: "AKINA"
        interactions:
          type: integer
          example: 2
        firstSeen:
          type: string
          example: "2026-07-18T12:35:15.908Z"
        lastSeen:
          type: string
          example: "2026-07-18T12:35:15.908Z"
        coreProfile:
          type: string
          description: JSON serialized string of profile structure
          example: '{"attributes":["student"],"preferences":["anime"],"concerns":[],"important_memories":[]}'
        chatHistory:
          type: array
          items:
            $ref: '#/components/schemas/ChatBubble'
        status:
          $ref: '#/components/schemas/UserStatus'

    UserCoreProfile:
      type: object
      properties:
        attributes:
          type: array
          items:
            type: string
        preferences:
          type: array
          items:
            type: string
        concerns:
          type: array
          items:
            type: string
        important_memories:
          type: array
          items:
            type: string

    ChatBubble:
      type: object
      properties:
        from:
          type: string
          enum: [user, rebecca]
          example: user
        text:
          type: string
          example: "Hello Rebecca!"
        thought:
          type: string
          description: Inner thoughts and reflection of the persona
          example: "本当は心配だけど、素直に言えないわね"
        time:
          type: string
          format: date-time
          example: "2026-07-18T13:35:28.000Z"

    TimelinePost:
      type: object
      properties:
        id:
          type: string
          example: p1
        tweetId:
          type: string
          example: "1934600616791482369"
        time:
          type: string
          format: date-time
          example: "2026-07-18T13:35:28.000Z"
        snippet:
          type: string
          example: "Hello world!"
        text:
          type: string
          example: "Hello world! Full post text"
        impressions:
          type: integer
          example: 450
        hasMedia:
          type: boolean
          example: false
        mediaUrls:
          type: array
          items:
            type: string
        status:
          type: string
          example: "ACTIVE"
        thought:
          type: string
          description: Inner thoughts and reflection of the persona
          example: "マスターが喜びそうな話題を選んでみたわ"
        postType:
          type: string
          enum: [news, soliloquy]
          example: "news"
        newsTitle:
          type: string
          example: "ITパスポート最新シラバス公開"

    PostDetail:
      type: object
      properties:
        id:
          type: string
          example: p1
        tweetId:
          type: string
          example: "1934600616791482369"
        time:
          type: string
          format: date-time
          example: "2026-07-18T13:35:28.000Z"
        content:
          type: string
          example: "Full detailed post content"
        thought:
          type: string
          description: Inner thoughts and reflection of the persona
          example: "マスターが喜びそうな話題を選んでみたわ"
        impressions:
          type: integer
          example: 450
        mediaUrls:
          type: array
          items:
            type: string
        status:
          type: string
          example: "ACTIVE"
        likes:
          type: integer
          example: 12
        retweets:
          type: integer
          example: 3
        reposts:
          type: integer
          example: 3
        replies:
          type: integer
