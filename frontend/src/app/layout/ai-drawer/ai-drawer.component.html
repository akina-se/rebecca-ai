<div class="drawer ai-drawer glass-panel" [class.open]="isOpen">
    <div class="drawer-header" style="background: transparent; border-bottom: 1px solid rgba(155, 89, 182, 0.3);">
        <h3 style="display: flex; align-items: center; gap: 8px;"><span class="material-icons" style="color: var(--color-primary);">auto_awesome</span> Rebecca</h3>
        <button class="close-btn" (click)="close()"><span class="material-icons">close</span></button>
    </div>
    <div class="drawer-body" style="padding-bottom: 0;">
        <div style="text-align: center; color: var(--color-primary); font-size: 0.8rem; margin-bottom: 1.5rem; font-weight: 500;" id="ai-context-indicator">
            Context: Global
        </div>
        <div class="ai-message">
            <div class="ai-avatar">R</div>
            <div class="ai-content">
                Hello! I am Rebecca. How can I help you manage the system today?
            </div>
        </div>
        <div style="display: flex; flex-wrap: wrap; margin-top: 1rem;">
            <div class="action-chip">Summarize Timeline</div>
            <div class="action-chip">Check Server Status</div>
            <div class="action-chip">Generate Assets</div>
        </div>
    </div>
    <div class="chat-input-container">
        <input type="text" class="chat-input" placeholder="Ask Rebecca anything...">
        <button class="send-btn"><span class="material-icons">send</span></button>
    </div>
</div>
